name: Deploy Manager image build

on:
  push:
    branches:
      - main # Keep these entries aligned with the enabled branch patterns in Deploy Manager.
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      display_version:
        description: Optional version name, for example 0.0.1-version
        required: false
        type: string

permissions:
  contents: read

jobs:
  checks:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.DEPLOY_MANAGER_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@v6

      - name: Install locked Node dependencies and run repository checks
        shell: pwsh
        run: |
          function Invoke-CheckedCommand {
            param([string]$Command, [string[]]$Arguments)
            & $Command @Arguments
            if ($LASTEXITCODE -ne 0) { throw "$Command failed with exit code $LASTEXITCODE" }
          }

          if (Test-Path 'pnpm-lock.yaml') {
            Invoke-CheckedCommand 'corepack' @('enable')
            Invoke-CheckedCommand 'pnpm' @('install', '--frozen-lockfile')
            node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)"
            if ($LASTEXITCODE -eq 0) { Invoke-CheckedCommand 'pnpm' @('run', 'lint') }
            node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"
            if ($LASTEXITCODE -eq 0) { Invoke-CheckedCommand 'pnpm' @('run', 'test') }
          } elseif (Test-Path 'package-lock.json') {
            Invoke-CheckedCommand 'npm' @('ci')
            Invoke-CheckedCommand 'npm' @('run', 'lint', '--if-present')
            Invoke-CheckedCommand 'npm' @('run', 'test', '--if-present')
          } elseif (Test-Path 'yarn.lock') {
            Invoke-CheckedCommand 'corepack' @('enable')
            Invoke-CheckedCommand 'yarn' @('install', '--immutable')
            node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)"
            if ($LASTEXITCODE -eq 0) { Invoke-CheckedCommand 'yarn' @('run', 'lint') }
            node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"
            if ($LASTEXITCODE -eq 0) { Invoke-CheckedCommand 'yarn' @('run', 'test') }
          } else {
            Write-Output 'No supported Node lockfile found; add this repository language test steps to the checks job.'
          }

  build-and-publish:
    if: ${{ github.event_name != 'pull_request' || (startsWith(github.head_ref, 'release/') && github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: checks
    runs-on: ${{ vars.DEPLOY_MANAGER_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      CONFIGURED_IMAGE: ${{ vars.DEPLOY_MANAGER_IMAGE_REPOSITORY || github.repository }}
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_COMMIT }}

      - name: Resolve version name
        id: version
        shell: pwsh
        env:
          SOURCE_BRANCH: ${{ env.SOURCE_BRANCH }}
          INPUT_VERSION: ${{ inputs.display_version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          $displayVersion = $env:INPUT_VERSION
          if ([string]::IsNullOrWhiteSpace($displayVersion) -and $env:SOURCE_BRANCH.StartsWith('release/')) {
            $candidateName = $env:SOURCE_BRANCH.Substring('release/'.Length).ToLowerInvariant()
            $candidateName = [regex]::Replace($candidateName, '[^a-z0-9._-]+', '-')
            $candidateName = [regex]::Replace($candidateName, '-+', '-').Trim('.','-')
            if ([string]::IsNullOrWhiteSpace($candidateName)) {
              throw "La rama release debe incluir un nombre, por ejemplo release/funcionalidad-nueva; recibida: $env:SOURCE_BRANCH"
            }
            $candidateName = $candidateName.Substring(0, [Math]::Min(90, $candidateName.Length))
            $displayVersion = "$candidateName-rc-$env:RUN_NUMBER"
          }
          if (-not [string]::IsNullOrWhiteSpace($displayVersion) -and $displayVersion -notmatch '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,119}$') {
            throw 'El nombre de versión no es válido como etiqueta de imagen.'
          }
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "display_version=$displayVersion`n", [System.Text.UTF8Encoding]::new($false))

      - name: Resolve GHCR image path
        id: image
        shell: pwsh
        run: |
          $imageName = $env:CONFIGURED_IMAGE.ToLowerInvariant()
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "reference=$($env:REGISTRY)/$imageName`n", [System.Text.UTF8Encoding]::new($false))

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create immutable commit tag
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.reference }}
          tags: |
            type=sha,format=long
            type=raw,value=${{ steps.version.outputs.display_version }},enable=${{ steps.version.outputs.display_version != '' }}

      - name: Build and publish image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ vars.DEPLOY_MANAGER_BUILD_CONTEXT || '.' }}
          file: ${{ vars.DEPLOY_MANAGER_DOCKERFILE || 'Dockerfile' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Report build result to Deploy Manager
        if: always()
        env:
          MANAGER_URL: ${{ vars.DEPLOY_MANAGER_URL }}
          APPLICATION_ID: ${{ vars.DEPLOY_MANAGER_APPLICATION_ID }}
          CALLBACK_TOKEN: ${{ secrets.DEPLOY_MANAGER_BUILD_TOKEN }}
          BUILD_STATUS: ${{ job.status }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          COMMIT_SHA: ${{ env.SOURCE_COMMIT }}
          BRANCH_NAME: ${{ env.SOURCE_BRANCH }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
          DISPLAY_VERSION: ${{ steps.version.outputs.display_version }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MANAGER_URL) -or [string]::IsNullOrWhiteSpace($env:APPLICATION_ID) -or [string]::IsNullOrWhiteSpace($env:CALLBACK_TOKEN)) {
            throw 'Configurá DEPLOY_MANAGER_URL, DEPLOY_MANAGER_APPLICATION_ID y DEPLOY_MANAGER_BUILD_TOKEN para registrar la versión automáticamente.'
          }

          $isLoopbackHttp = $env:MANAGER_URL -match '^http://(localhost|127\.0\.0\.1)(:[0-9]+)?(/|$)'
          if (-not $env:MANAGER_URL.StartsWith('https://') -and -not ($env:RUNNER_ENVIRONMENT -eq 'self-hosted' -and $isLoopbackHttp)) {
            throw 'Usá HTTPS con GitHub-hosted runners o http://localhost con un runner self-hosted local.'
          }

          $result = if ($env:BUILD_STATUS -eq 'success') { 'success' } else { 'failure' }
          $payload = [ordered]@{
            commitSha = $env:COMMIT_SHA
            branch = $env:BRANCH_NAME
            workflowRunId = $env:RUN_ID
            workflowAttempt = [int]$env:RUN_ATTEMPT
            buildRunUrl = $env:RUN_URL
            status = $result
          }
          if (-not [string]::IsNullOrWhiteSpace($env:IMAGE_DIGEST)) { $payload.imageDigest = $env:IMAGE_DIGEST }
          if (-not [string]::IsNullOrWhiteSpace($env:DISPLAY_VERSION)) { $payload.displayVersion = $env:DISPLAY_VERSION }
          $headers = @{ Authorization = "Bearer $env:CALLBACK_TOKEN"; 'X-Application-Id' = $env:APPLICATION_ID }
          Invoke-RestMethod -Method Post -Uri "$($env:MANAGER_URL)/integrations/build-callback" -Headers $headers -ContentType 'application/json' -Body ($payload | ConvertTo-Json -Compress)

  report-check-failure:
    if: ${{ always() && needs.checks.result == 'failure' && (github.event_name != 'pull_request' || (startsWith(github.head_ref, 'release/') && github.event.pull_request.head.repo.full_name == github.repository)) }}
    needs: checks
    runs-on: ${{ vars.DEPLOY_MANAGER_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - name: Report failed checks when the callback is configured
        env:
          MANAGER_URL: ${{ vars.DEPLOY_MANAGER_URL }}
          APPLICATION_ID: ${{ vars.DEPLOY_MANAGER_APPLICATION_ID }}
          CALLBACK_TOKEN: ${{ secrets.DEPLOY_MANAGER_BUILD_TOKEN }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MANAGER_URL) -or [string]::IsNullOrWhiteSpace($env:APPLICATION_ID) -or [string]::IsNullOrWhiteSpace($env:CALLBACK_TOKEN)) {
            Write-Output 'Checks failed; automatic callback is not configured.'
            exit 0
          }
          $isLoopbackHttp = $env:MANAGER_URL -match '^http://(localhost|127\.0\.0\.1)(:[0-9]+)?(/|$)'
          if (-not $env:MANAGER_URL.StartsWith('https://') -and -not ($env:RUNNER_ENVIRONMENT -eq 'self-hosted' -and $isLoopbackHttp)) {
            throw 'Use HTTPS with GitHub-hosted runners or http://localhost with a local self-hosted runner.'
          }
          $payload = @{
            commitSha = $env:COMMIT_SHA
            branch = $env:BRANCH_NAME
            workflowRunId = $env:RUN_ID
            workflowAttempt = [int]$env:RUN_ATTEMPT
            buildRunUrl = $env:RUN_URL
            status = 'failure'
          }
          $headers = @{ Authorization = "Bearer $env:CALLBACK_TOKEN"; 'X-Application-Id' = $env:APPLICATION_ID }
          Invoke-RestMethod -Method Post -Uri "$($env:MANAGER_URL)/integrations/build-callback" -Headers $headers -ContentType 'application/json' -Body ($payload | ConvertTo-Json -Compress)
