name: Deploy Manager image build

on:
  push:
    branches:
      - main # Keep these entries aligned with the enabled branch patterns in Deploy Manager.
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      display_version:
        description: Optional version name, for example 0.0.1-version
        required: false
        type: string

permissions:
  contents: read

jobs:
  checks:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.DEPLOY_MANAGER_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@v6

      - name: Install locked Node dependencies and run repository checks
        shell: bash
        run: |
          if [[ -f pnpm-lock.yaml ]]; then
            corepack enable
            pnpm install --frozen-lockfile
            if node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)"; then pnpm run lint; fi
            if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then pnpm run test; fi
          elif [[ -f package-lock.json ]]; then
            npm ci
            npm run lint --if-present
            npm run test --if-present
          elif [[ -f yarn.lock ]]; then
            corepack enable
            yarn install --immutable
            if node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)"; then yarn run lint; fi
            if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then yarn run test; fi
          else
            echo 'No supported Node lockfile found; add this repository language test steps to the checks job.'
          fi

  build-and-publish:
    if: ${{ github.event_name != 'pull_request' || (startsWith(github.head_ref, 'release/') && github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: checks
    runs-on: ${{ vars.DEPLOY_MANAGER_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      CONFIGURED_IMAGE: ${{ vars.DEPLOY_MANAGER_IMAGE_REPOSITORY || github.repository }}
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_COMMIT }}

      - name: Resolve version name
        id: version
        shell: bash
        env:
          SOURCE_BRANCH: ${{ env.SOURCE_BRANCH }}
          INPUT_VERSION: ${{ inputs.display_version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          display_version="$INPUT_VERSION"
          if [[ -z "$display_version" && "$SOURCE_BRANCH" == release/* ]]; then
            candidate_name="${SOURCE_BRANCH#release/}"
            candidate_name="${candidate_name,,}"
            candidate_name="$(printf '%s' "$candidate_name" | sed -E 's/[^a-z0-9._-]+/-/g; s/-+/-/g; s/^[.-]+//; s/[.-]+$//')"
            if [[ -z "$candidate_name" ]]; then
              echo "La rama release debe incluir un nombre, por ejemplo release/funcionalidad-nueva; recibida: $SOURCE_BRANCH" >&2
              exit 1
            fi
            display_version="${candidate_name:0:90}-rc-${RUN_NUMBER}"
          fi
          if [[ -n "$display_version" && ! "$display_version" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,119}$ ]]; then
            echo 'El nombre de versión no es válido como etiqueta de imagen.' >&2
            exit 1
          fi
          echo "display_version=$display_version" >> "$GITHUB_OUTPUT"

      - name: Resolve GHCR image path
        id: image
        shell: bash
        run: |
          image_name="${CONFIGURED_IMAGE,,}"
          echo "reference=${REGISTRY}/${image_name}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create immutable commit tag
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.reference }}
          tags: |
            type=sha,format=long
            type=raw,value=${{ steps.version.outputs.display_version }},enable=${{ steps.version.outputs.display_version != '' }}

      - name: Build and publish image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ vars.DEPLOY_MANAGER_BUILD_CONTEXT || '.' }}
          file: ${{ vars.DEPLOY_MANAGER_DOCKERFILE || 'Dockerfile' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Report build result to Deploy Manager
        if: always()
        env:
          MANAGER_URL: ${{ vars.DEPLOY_MANAGER_URL }}
          APPLICATION_ID: ${{ vars.DEPLOY_MANAGER_APPLICATION_ID }}
          CALLBACK_TOKEN: ${{ secrets.DEPLOY_MANAGER_BUILD_TOKEN }}
          BUILD_STATUS: ${{ job.status }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          COMMIT_SHA: ${{ env.SOURCE_COMMIT }}
          BRANCH_NAME: ${{ env.SOURCE_BRANCH }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
          DISPLAY_VERSION: ${{ steps.version.outputs.display_version }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        shell: bash
        run: |
          if [[ -z "$MANAGER_URL" || -z "$APPLICATION_ID" || -z "$CALLBACK_TOKEN" ]]; then
            echo 'Configurá DEPLOY_MANAGER_URL, DEPLOY_MANAGER_APPLICATION_ID y DEPLOY_MANAGER_BUILD_TOKEN para registrar la Version automáticamente.' >&2
            exit 1
          fi

          if [[ "$MANAGER_URL" != https://* ]] && ! { [[ "$RUNNER_ENVIRONMENT" == 'self-hosted' ]] && [[ "$MANAGER_URL" =~ ^http://(localhost|127\.0\.0\.1)(:[0-9]+)?(/|$) ]]; }; then
            echo 'Usá HTTPS con GitHub-hosted runners o http://localhost con un runner self-hosted local.' >&2
            exit 1
          fi

          result='success'
          [[ "$BUILD_STATUS" == 'success' ]] || result='failure'
          payload=$(node -e '
            const [commitSha, branch, workflowRunId, attempt, buildRunUrl, status, imageDigest, displayVersion] = process.argv.slice(1);
            const payload = { commitSha, branch, workflowRunId, workflowAttempt: Number(attempt), buildRunUrl, status };
            if (imageDigest) payload.imageDigest = imageDigest;
            if (displayVersion) payload.displayVersion = displayVersion;
            process.stdout.write(JSON.stringify(payload));
          ' "$COMMIT_SHA" "$BRANCH_NAME" "$RUN_ID" "$RUN_ATTEMPT" "$RUN_URL" "$result" "$IMAGE_DIGEST" "$DISPLAY_VERSION")

          curl --fail --silent --show-error \
            --request POST "$MANAGER_URL/integrations/build-callback" \
            --header "Authorization: Bearer $CALLBACK_TOKEN" \
            --header "X-Application-Id: $APPLICATION_ID" \
            --header 'Content-Type: application/json' \
            --data "$payload"

  report-check-failure:
    if: ${{ always() && needs.checks.result == 'failure' && (github.event_name != 'pull_request' || (startsWith(github.head_ref, 'release/') && github.event.pull_request.head.repo.full_name == github.repository)) }}
    needs: checks
    runs-on: ${{ vars.DEPLOY_MANAGER_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - name: Report failed checks when the callback is configured
        env:
          MANAGER_URL: ${{ vars.DEPLOY_MANAGER_URL }}
          APPLICATION_ID: ${{ vars.DEPLOY_MANAGER_APPLICATION_ID }}
          CALLBACK_TOKEN: ${{ secrets.DEPLOY_MANAGER_BUILD_TOKEN }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        shell: bash
        run: |
          if [[ -z "$MANAGER_URL" || -z "$APPLICATION_ID" || -z "$CALLBACK_TOKEN" ]]; then
            echo 'Checks failed; automatic callback is not configured.'
            exit 0
          fi
          if [[ "$MANAGER_URL" != https://* ]] && ! { [[ "$RUNNER_ENVIRONMENT" == 'self-hosted' ]] && [[ "$MANAGER_URL" =~ ^http://(localhost|127\.0\.0\.1)(:[0-9]+)?(/|$) ]]; }; then
            echo 'Use HTTPS with GitHub-hosted runners or http://localhost with a local self-hosted runner.' >&2
            exit 1
          fi
          payload=$(node -e '
            const [commitSha, branch, workflowRunId, attempt, buildRunUrl] = process.argv.slice(1);
            process.stdout.write(JSON.stringify({ commitSha, branch, workflowRunId, workflowAttempt: Number(attempt), buildRunUrl, status: "failure" }));
          ' "$COMMIT_SHA" "$BRANCH_NAME" "$RUN_ID" "$RUN_ATTEMPT" "$RUN_URL")
          curl --fail --silent --show-error \
            --request POST "$MANAGER_URL/integrations/build-callback" \
            --header "Authorization: Bearer $CALLBACK_TOKEN" \
            --header "X-Application-Id: $APPLICATION_ID" \
            --header 'Content-Type: application/json' \
            --data "$payload"
